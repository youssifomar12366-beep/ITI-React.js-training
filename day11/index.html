<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Lab Assignment</title>
    <link rel="stylesheet" href="css.css">

</head>
<body>

    <h1>JavaScript Lab Assignments</h1>

    <div>
        <!-- Task 1: Dropdown list, button (Show image) disabled by default, user details display[span_1](start_span)[span_1](end_span) -->
        <h2>Task 1: Fetch and Promises</h2>
        <select id="usersSelect1">
            <option>Loading users...</option>
        </select>
        <button id="showBtn1" disabled>Show Image</button>
        <div id="userDetails1"></div>
    </div>

    <hr>

    <div>
        <!-- Task 2: Async and await with previous assignment[span_2](start_span)[span_2](end_span) -->
        <h2>Task 2: Async / Await</h2>
        <select id="usersSelect2">
            <option>Loading users...</option>
        </select>
        <button id="showBtn2" disabled>Show Image</button>
        <div id="userDetails2"></div>
    </div>

    <hr>

    <div>
        <!-- Task 3: Use fetch to add new post[span_3](start_span)[span_3](end_span) -->
        <h2>Task 3: Add New Post</h2>
        <button id="addPostBtn">Add Post</button>
        <div id="postDetails"></div>
    </div>

    <hr>

    <div>
        <!-- Task 4: Web page sequence using Promises[span_4](start_span)[span_4](end_span) -->
        <h2>Task 4: Promise Sequence</h2>
        <button id="startSequenceBtn">Start Sequence</button>
        <div id="sequenceOutput"></div>
    </div>

    <hr>

    <div>
        <!-- Task 5: Try (with demo) Proxy in ES.next[span_5](start_span)[span_5](end_span) -->
        <h2>Task 5: ES.Next Proxy Demo</h2>
        <button id="proxyDemoBtn">Run Proxy Demo</button>
        <div id="proxyOutput"></div>
    </div>

    <hr>

    <div>
        <!-- Bonus: Explain other ES.Next new features using a demo[span_6](start_span)[span_6](end_span) -->
        <h2>Bonus: ES.Next Features Demo</h2>
        <button id="bonusDemoBtn">Run ES.Next Demos</button>
        <div id="bonusOutput"></div>
    </div>
<script src="script.js" defer></script>
</body>
</html>
