<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 8 Lab Assignment</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. DOM Manipulation -->
    <section>
        <h2>1. DOM Manipulation</h2>
    
        <div id="dom-div"> 
        </div>
        <button id="run-dom-btn">Run DOM Task</button>
    </section>

    <hr>

    <!-- 2 & 6. 5-Star Rating Control -->
    <section>
        <h2>2 & 6. Star Rating Control</h2>
        <div id="stars-container">
            
            <img src="SFhatsApp Image 2026-07-28 at 1.00.07 PM.jpeg" class="star" data-index="1" alt="star">
            <img src="SFhatsApp Image 2026-07-28 at 1.00.07 PM.jpeg" class="star" data-index="2" alt="star">
            <img src="SFhatsApp Image 2026-07-28 at 1.00.07 PM.jpeg" class="star" data-index="3" alt="star">
            <img src="SFhatsApp Image 2026-07-28 at 1.00.07 PM.jpeg" class="star" data-index="4" alt="star">
            <img src="SFhatsApp Image 2026-07-28 at 1.00.07 PM.jpeg" class="star" data-index="5" alt="star">
        </div>
    </section>

    <hr>

    <!-- 3. Search Textbox Animation without CSS Transition -->
    <section>
        <h2>3. Search Textbox (JS Animation Only)</h2>
        <input type="text" id="search-box" placeholder="Search...">
    </section>

    <hr>

    <!-- 4. Image Slideshow -->
    <section>
        <h2>4. Image Slideshow</h2>
        <div id="slideshow-container">
            <img id="slide-img" src="1hatsApp Image 2026-07-26 at 8.51.53 PM.jpeg" alt="slideshow image">
            <p id="slide-desc" class="hidden">Image Description</p>
            <div class="controls">
                <button id="prev-btn">Prev</button>
                <button id="next-btn">Next</button>
            </div>
        </div>
    </section>

    <hr>

    <!-- 5. Drag and Drop -->
    <section>
        <h2>5. Drag and Drop</h2>
        <div class="drag-wrapper">
            <div id="drop-zone">Drop Here</div>
            <img id="drag-item" src="WhatsApp Image 2026-07-26 at 3.52.19 PM.jpeg" draggable="true" alt="Drag me">
        </div>
    </section>

    <hr>

    <!-- 6. Form + Gender Dropdown -->
    <section>
        <h2>6. Form + Gender Dropdown</h2>
        <form id="user-form">
            <input type="text" id="user-name" placeholder="Enter your name">
            <select id="user-gender">
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </form>
        <p id="greeting-msg"></p>
    </section>

    <hr>

    <!-- 7. Final Required Script -->
    <script>document.write("Thank YOU")</script>
    <script src="script.js"></script>
</body>
</html>
