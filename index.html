  <title>ITI React.js Training Labs</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#f5f7fb;
      color:#333;
    }

    header{
      background:#24292e;
      color:white;
      text-align:center;
      padding:40px 20px;
    }

    header h1{
      margin-bottom:10px;
    }

    header p{
      color:#d1d5db;
    }

    .container{
      width:90%;
      max-width:1200px;
      margin:40px auto;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:20px;
    }

    .card{
      background:white;
      border-radius:12px;
      padding:25px;
      text-align:center;
      box-shadow:0 5px 15px rgba(0,0,0,.08);
      transition:.3s;
    }

    .card:hover{
      transform:translateY(-8px);
    }

    .card h2{
      margin-bottom:15px;
    }

    .card a{
      display:inline-block;
      text-decoration:none;
      background:#0d6efd;
      color:white;
      padding:10px 20px;
      border-radius:8px;
    }

    footer{
      text-align:center;
      margin:40px;
      color:#777;
    }
  </style>
</head>
